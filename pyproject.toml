[project]
name = "work-trial"
version = "0.1.0"
description = "Sequential modeling of business-process traces + reusable agent-trace learning loop"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "lxml>=5.0",
    "torch>=2.4",
    "scikit-learn>=1.5",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "anthropic>=0.40",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]
# AppWorld pins pydantic<2 and is installed in its own venv (.venv-appworld); see README.


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bpm", "agentloop"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
